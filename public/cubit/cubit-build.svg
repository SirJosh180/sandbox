<svg class="cubit cubit--build" viewBox="-8 -10 228 234" role="img" aria-label="Cubit: let's build" xmlns="http://www.w3.org/2000/svg"><style>/* ---------------- Cubit, the helper buddy ---------------- */

.cubit *{transform-box:view-box}
.cubit .cb-body{animation:cb-bob 2.8s ease-in-out infinite}
.cubit .cb-shadow{transform-origin:102px 212px;animation:cb-shadow 2.8s ease-in-out infinite}
.cubit .cb-eyes{transform-origin:99px 98px;animation:cb-blink 4.5s infinite}
.cubit .cb-prop{transform-origin:104px 14px;animation:cb-float 2.4s ease-in-out infinite}
.cubit .cb-wave{transform-origin:170px 116px;animation:cb-wave 1.6s ease-in-out infinite}
.cubit .cb-hammer{transform-origin:170px 116px;animation:cb-hammer .9s ease-in-out infinite}
.cubit--hmm .cb-prop{animation:cb-tilt 2s ease-in-out infinite}
.cubit--oops .cb-body{animation:cb-shake .5s ease-in-out infinite}
.cubit--oops .cb-prop{animation:cb-tumble 1.4s ease-in-out infinite}
.cubit .cb-panic{transform-origin:105px 112px;animation:cb-panic .35s ease-in-out infinite alternate}
.cubit .cb-drop{animation:cb-drop 1.2s ease-in infinite}
@keyframes cb-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes cb-shadow{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.88)}}
@keyframes cb-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes cb-float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(8deg)}}
@keyframes cb-tilt{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg) translateY(-3px)}}
@keyframes cb-wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(10deg)}}
@keyframes cb-hammer{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg)}}
@keyframes cb-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px) rotate(-1deg)}75%{transform:translateX(3px) rotate(1deg)}}
@keyframes cb-tumble{0%{transform:rotate(0)}50%{transform:rotate(180deg) translateY(-4px)}100%{transform:rotate(360deg)}}
@keyframes cb-panic{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes cb-drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse class="cb-shadow" cx="102" cy="212" rx="56" ry="7" fill="rgba(0,0,0,.18)"/><g class="cb-prop"><polygon points="104,0 116,6 104,12 92,6" fill="#fbe3ad"/><polygon points="92,6 104,12 104,26 92,20" fill="#f4cf82"/><polygon points="116,6 104,12 104,26 116,20" fill="#e3a94a"/></g><g class="cb-body"><g class="cb-legs"><path d="M80 168 v24 M124 168 v24" stroke="#10141b" stroke-width="7" stroke-linecap="round"/><ellipse cx="80" cy="198" rx="15" ry="7" fill="#e3a94a"/><ellipse cx="126" cy="198" rx="15" ry="7" fill="#e3a94a"/></g><g class="cb-arm-l"><path d="M40 112 q-18 6 -20 30" fill="none" stroke="#10141b" stroke-width="6" stroke-linecap="round"/><circle cx="20" cy="146" r="8" fill="#f4cf82"/></g><g class="cb-arm-r cb-hammer"><path d="M170 116 q20 -4 22 -36" fill="none" stroke="#10141b" stroke-width="6" stroke-linecap="round"/><g transform="translate(192 80) rotate(8)"><rect x="-3" y="-34" width="6" height="30" rx="3" fill="#8b95a5"/><path d="M-10 -40 a10 10 0 1 1 20 0 l-5 0 l0 -7 l-10 0 l0 7z" fill="#8b95a5"/></g><circle cx="192" cy="80" r="8" fill="#f4cf82"/></g><polygon points="52,46 74,30 176,30 154,46" fill="#a8f0d8"/><polygon points="154,46 176,30 176,148 154,172" fill="#2fbf93"/><rect x="40" y="44" width="118" height="128" rx="14" fill="#5ee3bc"/><rect x="54" y="62" width="90" height="72" rx="11" fill="#10141b"/><g class="cb-face"><g class="cb-eyes" fill="none" stroke="#5ee3bc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M70 103 l8 -9 l8 9"/><path d="M104 103 l8 -9 l8 9"/></g><path d="M76 114 h38 a19 15 0 0 1 -38 0z" fill="#5ee3bc"/></g><text x="99" y="158" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="12" fill="#10141b">&gt;_</text></g></svg>